# ?????????????????????????????????????????????????????????????
#  application.properties
#  Community Discussion and Review Platform
# ?????????????????????????????????????????????????????????????

# ?? Server ????????????????????????????????????????????????????
server.port=8080


# ?? MySQL Database Connection ?????????????????????????????????
#
#   Before starting the app:
#   1. Create a MySQL database:  CREATE DATABASE community_db;
#   2. Replace 'root' and 'yourpassword' with your credentials.
#
spring.datasource.url=jdbc:mysql://localhost:3306/community_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ?? Hibernate / JPA ???????????????????????????????????????????
#
#   ddl-auto options:
#     create       ? drops and recreates all tables on startup (use during early dev)
#     update       ? alters tables to match entities without dropping data (use during mid dev)
#     validate     ? checks schema matches entities, fails if not (use before production)
#     none         ? does nothing (use in production with proper migrations)
#
spring.jpa.hibernate.ddl-auto=update

#   Show the SQL Hibernate generates in the console ? very helpful for learning
spring.jpa.show-sql=true

#   Format that SQL so it is readable
spring.jpa.properties.hibernate.format_sql=true

#   Tell Hibernate which SQL dialect to use
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#   Defer datasource initialization so that schema.sql (if added later) runs after JPA
spring.jpa.defer-datasource-initialization=true


# ?? JWT Configuration ?????????????????????????????????????????
#
#   secret: a long random string used to sign tokens ? NEVER commit a real secret
#           to version control. Use environment variables in production.
#   expiration: token validity in milliseconds
#                86400000  =  1 day
#               604800000  =  7 days
#
app.jwt.secret=thisIsAVeryLongSecretKeyForJWTSigningPleaseChangeThisInProduction1234567890
app.jwt.expiration=86400000


# ?? Spring Security ???????????????????????????????????????????
#
#   Disable the auto-generated default security password that Spring Boot
#   prints to the console on startup. Without this, Spring Boot generates
#   a random password for a default "user" account every time ? not needed
#   because we have our own CustomUserDetailsService.
#
spring.security.user.name=disabled
spring.security.user.password=disabled


# ?? Logging ???????????????????????????????????????????????????
#
#   WARN suppresses the verbose per-request security decision logs.
#   Change to DEBUG temporarily if you need to trace auth failures
#   (e.g. "401 - no token" vs "403 - wrong role").
#
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.communityplatform=DEBUG
#
#   Uncomment the line below to see detailed JWT filter decisions:
#logging.level.com.communityplatform.community.security=DEBUG
